<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded app icon -->
  <rect width="512" height="512" rx="115" fill="url(#grad)" />

  <!-- Inner border ring -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="white" stroke-opacity="0.15" stroke-width="8" />

  <!-- Shopping bag & barcode icon in center -->
  <g filter="url(#shadow)" fill="white">
    <!-- Store Roof / Canopy -->
    <path d="M120 180 L256 100 L392 180 L392 210 L120 210 Z" />
    <!-- Pillars / Body -->
    <rect x="140" y="230" width="40" height="150" rx="10" />
    <rect x="236" y="230" width="40" height="150" rx="10" />
    <rect x="332" y="230" width="40" height="150" rx="10" />
    <!-- Store Base -->
    <rect x="110" y="390" width="292" height="30" rx="10" />
    <!-- Dynamic Lightning / Fast Cash Accent in Gold -->
    <polygon points="280,260 230,340 260,340 230,420 300,320 265,320" fill="#FDE047" />
  </g>
</svg>
